[workspace]
resolver = "3"
members = ["crates/app", "crates/model", "crates/ui"]
# The Audible backend is developed as a standalone crate for now; it joins the
# workspace once the app starts depending on it.
exclude = ["crates/audible", "vendor/gpui-pre-macos"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
gpui-kit = "0.9.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
model = { path = "crates/model" }
ui = { path = "crates/ui" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# gpui-pre-macos 0.3.12 calls `Option::map_or_default`, which is not stable in
# the pinned Rust 1.97 toolchain. The vendored copy differs only by three
# `.map(..).unwrap_or_default()` rewrites; see vendor/README.md. Drop this patch
# once the toolchain is newer.
[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

# GPUI is slow in unoptimised builds; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
