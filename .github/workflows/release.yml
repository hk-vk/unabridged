name: Release

# Pushing a tag like v0.1.0 builds and signs Unabridged.app, publishes a GitHub
# release (zip, signed appcast.xml, notes from CHANGELOG.md) and points the
# Homebrew cask at it. Installed copies find updates through
# releases/latest/download/appcast.xml. Run it by hand with a tag name for a
# dry run: it builds and uploads the files as an artifact, publishing nothing.
#
# The windows job builds Unabridged.exe into a zip and attaches it to the same
# release (or to the dry run's artifacts).
#
# One-time setup: tools/release-setup.sh, then the secrets it lists.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag such as v0.1.0 (a dry run, nothing is published; made locally if it doesn't exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A dry run can name a tag that isn't pushed yet, since pushing one publishes.
      - name: Make the tag for a dry run
        if: env.PUBLISH != 'true'
        run: git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG"

      - name: Use Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      # rust-toolchain.toml picks the version; this installs it.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      # CI already tested this commit; the release only builds. The cache keeps
      # the dependencies compiled between releases.
      - uses: Swatinem/rust-cache@v2

      - name: Check the version
        run: |
          VERSION="${TAG#v}"
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' assets/macos/Info.plist)"
          CARGO="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$PLIST" != "$VERSION" ] || [ "$CARGO" != "$VERSION" ]; then
            echo "::error::Info.plist says $PLIST and Cargo.toml says $CARGO, but the tag is $TAG"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The same self-signed "Unabridged Signing" identity for every release, so
      # macOS keeps the app's permissions across updates.
      - name: Import the signing identity
        env:
          P12: ${{ secrets.SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          base64 --decode <<<"$P12" > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Build
        run: tools/build-release.sh "Unabridged Signing"

      - name: Zip and write the release notes
        run: |
          ZIP="Unabridged-$VERSION.zip"
          ditto -c -k --keepParent target/release-app/Unabridged.app "$ZIP"
          tools/release-notes.sh "$TAG" "$ZIP" > notes.md
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo '::error::SPARKLE_PRIVATE_KEY is not configured'; exit 1; }
          mkdir -p update-feed
          cp "$ZIP" update-feed/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | target/sparkle/bin/generate_appcast \
            --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" update-feed
          cp update-feed/appcast.xml appcast.xml

      - name: Keep the build (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Unabridged-${{ env.VERSION }}
          path: |
            ${{ env.ZIP }}
            notes.md
            appcast.xml

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "$ZIP" appcast.xml --title "Unabridged $VERSION" --notes-file notes.md --verify-tag

      - name: Check out the Homebrew tap
        if: env.PUBLISH == 'true'
        uses: actions/checkout@v4
        with:
          repository: hk-vk/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the cask
        if: env.PUBLISH == 'true'
        working-directory: tap
        run: |
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
            Casks/unabridged.rb
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Unabridged $VERSION"
          git push

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  windows:
    runs-on: windows-latest
    needs: release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Whisper build prerequisites
        shell: pwsh
        run: |
          if (!(Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'CMake installation failed' }
            "$env:ProgramFiles\CMake\bin" >> $env:GITHUB_PATH
          }
          $clang = "$env:ProgramFiles\LLVM\bin"
          if (!(Test-Path "$clang\libclang.dll")) {
            choco install llvm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'LLVM installation failed' }
          }
          if (!(Test-Path "$clang\libclang.dll")) { throw 'libclang.dll not found' }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p better-audible

      - name: Zip
        run: |
          VERSION="${TAG#v}"
          ZIP="Unabridged-$VERSION-windows-x64.zip"
          mkdir -p dist/Unabridged
          cp target/release/better-audible.exe dist/Unabridged/Unabridged.exe
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY.md dist/Unabridged/
          (cd dist && 7z a -tzip "../$ZIP" Unabridged >/dev/null)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Keep the build (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Unabridged-${{ env.VERSION }}-windows
          path: ${{ env.ZIP }}

      - name: Attach to the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ZIP"
