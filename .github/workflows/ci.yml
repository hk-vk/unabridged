name: CI

# Formatting, clippy and tests on every push to main and every pull request,
# so a broken build shows up before a release tag does.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      # rust-toolchain.toml picks the version; this installs it.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  windows:
    name: Lint and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Whisper build prerequisites
        shell: pwsh
        run: |
          if (!(Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'CMake installation failed' }
            "$env:ProgramFiles\CMake\bin" >> $env:GITHUB_PATH
          }
          $clang = "$env:ProgramFiles\LLVM\bin"
          if (!(Test-Path "$clang\libclang.dll")) {
            choco install llvm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'LLVM installation failed' }
          }
          if (!(Test-Path "$clang\libclang.dll")) { throw 'libclang.dll not found' }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test the Audible crate
        run: cargo test --manifest-path crates/audible/Cargo.toml
