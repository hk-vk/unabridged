[package]
name = "better-audible"
description = "Better Audible: a native Audible client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "better-audible"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow.workspace = true
audible = { path = "../audible" }
tokio = { version = "1", features = ["rt", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3"] }
whisper-rs = "0.16"

gpui-kit.workspace = true
image.workspace = true
model.workspace = true
raw-window-handle = "0.6"
ui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows = { version = "0.61.3", features = ["Media_Playback", "Media_Core", "Storage", "Storage_Streams", "Foundation", "Win32_System_WinRT", "Win32_System_Com", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

[build-dependencies]
cc = "1"
embed-resource = "3"
